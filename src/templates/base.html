<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ seo_title }}</title>
<meta name="description" content="{{ seo_description }}">
<!-- Preview build: keep noindex until this becomes the live store -->
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://chesedhair.com{{ canonical }}">
<meta property="og:title" content="{{ seo_title }}">
<meta property="og:description" content="{{ seo_description }}">
<meta property="og:type" content="{{ og_type|default('website') }}">
{% if og_image %}<meta property="og:image" content="{{ og_image }}">{% endif %}
<meta name="theme-color" content="#241812">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/marcellus-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/hanken-grotesk-400.woff2" as="font" type="font/woff2" crossorigin>
{% block preload %}{% endblock %}
<link rel="stylesheet" href="/assets/css/style.css?v={{ version }}">
{% if jsonld %}<script type="application/ld+json">{{ jsonld|safe }}</script>{% endif %}
</head>
<body class="{{ body_class }}">
<a class="skip-link" href="#main">Skip to content</a>
{% include "partials/announcement.html" %}
{% include "partials/header.html" %}
<main id="main">
{% block main %}{% endblock %}
</main>
{% include "partials/footer.html" %}
{% include "partials/cart_drawer.html" %}
<script>window.CHESED={freeShip:{{ free_ship }}};</script>
<script src="/assets/js/main.js?v={{ version }}" defer></script>
</body>
</html>
